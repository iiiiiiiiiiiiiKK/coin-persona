<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="炒币人格测试 COIN PERSONA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08120f"/>
      <stop offset="55%" stop-color="#050908"/>
      <stop offset="100%" stop-color="#0b1a15"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4bffb0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4bffb0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.1" r="0.75">
      <stop offset="0%" stop-color="#4bffb0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4bffb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#9db4ab" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="420" fill="#4bffb0"/>

  <!-- brand row -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace">
    <text x="64" y="86" fill="#4bffb0" font-size="20" letter-spacing="6">COIN PERSONA</text>
    <text x="64" y="112" fill="#6b827b" font-size="13" letter-spacing="3.4">LOCAL ENGINE · NO WALLET · NO SIGN-UP</text>
    <text x="1136" y="86" fill="#6b827b" font-size="12" letter-spacing="2.4" text-anchor="end">v1.0.0 / 26 QUESTIONS</text>
    <text x="1136" y="110" fill="#ff9f43" font-size="12" letter-spacing="2.4" text-anchor="end">12 PERSONAS · 6 DIMENSIONS</text>
  </g>

  <line x1="64" y1="138" x2="1136" y2="138" stroke="#9db4ab" stroke-opacity="0.26"/>

  <!-- title -->
  <text x="62" y="262" fill="#eaf6f0" font-family="'Songti SC','Noto Serif SC',Georgia,'Times New Roman',serif" font-size="96" font-weight="700" letter-spacing="2">炒币人格测试</text>
  <text x="66" y="312" fill="#9db4ab" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" letter-spacing="1">12–16 道加密交易情景题，给你的交易人格做一次 CT</text>

  <!-- chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.6">
    <rect x="66" y="338" width="150" height="34" rx="17" fill="#4bffb0" fill-opacity="0.10" stroke="#4bffb0" stroke-opacity="0.34"/>
    <text x="141" y="360" fill="#4bffb0" text-anchor="middle">DETERMINISTIC</text>
    <rect x="228" y="338" width="126" height="34" rx="17" fill="#4bffb0" fill-opacity="0.10" stroke="#4bffb0" stroke-opacity="0.34"/>
    <text x="291" y="360" fill="#4bffb0" text-anchor="middle">PRIVATE</text>
    <rect x="366" y="338" width="132" height="34" rx="17" fill="#ff9f43" fill-opacity="0.10" stroke="#ff9f43" stroke-opacity="0.34"/>
    <text x="432" y="360" fill="#ff9f43" text-anchor="middle">SHARE 1:1/3:4</text>
  </g>

  <!-- right trend chart -->
  <g transform="translate(742, 150)">
    <path d="M0 190 L46 176 L92 184 L138 150 L184 162 L230 124 L276 136 L322 96 L368 108 L408 62 L408 218 L0 218 Z" fill="url(#fade)"/>
    <path d="M0 190 L46 176 L92 184 L138 150 L184 162 L230 124 L276 136 L322 96 L368 108 L408 62" fill="none" stroke="#4bffb0" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0 202 L52 198 L104 208 L156 188 L208 196 L260 180 L312 190 L364 176 L408 182" fill="none" stroke="#ff9f43" stroke-width="1.4" stroke-dasharray="5 6" stroke-opacity="0.75"/>
    <circle cx="408" cy="62" r="5.5" fill="#ff9f43"/>
    <g stroke="#9db4ab" stroke-opacity="0.22">
      <line x1="0" y1="218" x2="408" y2="218" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="218" stroke-width="1"/>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="10" fill="#6b827b" letter-spacing="1.4">
      <text x="0" y="238">PERSONA SIGNAL</text>
      <text x="408" y="238" text-anchor="end">NOT MARKET DATA</text>
    </g>
  </g>
</svg>
